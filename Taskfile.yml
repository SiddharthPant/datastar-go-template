version: "3"

dotenv: [".env"]            # loads DATABASE_URL et al. into task envs

tasks:
  dev:
    desc: Run the web server with local build tag + hot reload
    deps: [templ]
    cmds:
      - go run -tags local ./cmd/web

  run:
    desc: Run the web server (server build)
    deps: [templ]
    cmds:
      - go run ./cmd/web

  templ:
    desc: Generate Go from .templ files
    cmds:
      - go tool templ generate
    sources:
      - "**/*.templ"
    generates:
      - "**/*.templ.go"
  
  debug:
    desc: Debug the web server
    cmds:
      - go tool dlv exec ./bin/main
    deps:
      - build
  
  live:templ:
    desc: Watch .templ files and regenerate on change
    cmds:
      - go tool templ generate --watch

  templ:watch:
    desc: Watch .templ files and regenerate on change
    cmds:
      - go tool templ generate --watch

  live:server:
    desc: Run the web server with hot reload
    cmds:
      - |
        go tool air \
        -build.cmd "go build -tags=dev -o tmp/main ./cmd/web" \
        -build.exclude_dir "data,node_modules" \
        -build.include_ext "go,templ" \
        -misc.clean_on_exit true
  
  live:
    desc: Run the web server with hot reload and templ generation
    deps:
      - live:templ
      - live:server

  gen:
    desc: Run all code generation (sqlc + templ)
    deps: [sqlc:generate, templ]

  sqlc:generate:
    desc: Regenerate database/sqlc from queries + migrations
    cmds:
      - go tool sqlc generate

  sqlc:vet:
    desc: Lint + prepare-check every query against the managed PG
    cmds:
      - go tool sqlc vet

  sqlc:diff:
    desc: Fail if committed database/sqlc is stale vs. queries
    cmds:
      - go tool sqlc diff

  db:migrate:
    desc: Apply migrations to local DB
    cmds:
      - go tool goose -dir database/migrations postgres "$DATABASE_URL" up

  db:rollback:
    desc: Roll back the last migration
    cmds:
      - go tool goose -dir database/migrations postgres "$DATABASE_URL" down

  db:status:
    desc: Show migration status
    cmds:
      - go tool goose -dir database/migrations postgres "$DATABASE_URL" status

  db:new:
    desc: 'Scaffold a migration: task db:new -- add_posts'
    cmds:
      - go tool goose -dir database/migrations create {{.CLI_ARGS}} sql

  db:seed:
    desc: Seed local org/team/user data
    cmds:
      - go run ./cmd/seed

  db:reset:
    desc: Drop, recreate, migrate, and seed the local DATABASE_URL
    prompt: This will destroy all data in {{.POSTGRES_DB}}. Continue?
    cmds:
      - psql "$SQLC_DATABASE_URL" -c 'DROP DATABASE IF EXISTS "{{.POSTGRES_DB}}" WITH (FORCE)'
      - psql "$SQLC_DATABASE_URL" -c 'CREATE DATABASE "{{.POSTGRES_DB}}"'
      - task: db:migrate
      - task: db:seed

  db:nuke:
    desc: Nuke DB container itself and start with a clean slate
    prompt: This will nuke the DB instance and all data in {{.POSTGRES_DB}}. Continue?
    cmds:
      - docker compose down -v && docker compose up -d postgres --wait
      - task: db:migrate
      - task: db:seed