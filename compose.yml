name: datastar-go

services:
  postgres:
    build:
      context: docker/postgres
    image: datastar-go-postgres:pg18-paradedb
    env_file:
      - .env
    ports:
      - "5432:5432"
    command: postgres -c shared_preload_libraries=pg_search
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP monitoring
    command:
      - "-js"
      - "-m"
      - "8222"
      - "-sd"
      - "/data"
    volumes:
      - nats_data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    environment:
      RUSTFS_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    command: /data
    restart: unless-stopped

  observability:
    image: grafana/otel-lgtm:latest
    ports:
      - "8080:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - observability_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
  observability_data:
  rustfs_data:
  rustfs_logs:
