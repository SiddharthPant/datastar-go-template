version: "2"

servers:
  - engine: postgresql
    uri: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

sql:
  - engine: "postgresql"
    schema: "database/migrations" # read schema straight from migrations dir
    queries: "database/queries"
    database:
      managed: true # sqlc spins an ephemeral PG from schema for vet
    rules:
      - sqlc/db-prepare # PREPARE every query against the managed DB
    gen:
      go:
        package: "sqlc"
        out: "database/sqlc"
        sql_package: "pgx/v5"

        emit_interface: true # Querier interface -> mockable in tests
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true # []T{} not nil for :many — friendlier JSON/templ
        emit_pointers_for_null_types: true
        json_tags_case_style: "camel"

        overrides:
          # UUID primary keys / FKs
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"

          # pgvector — only if vector columns exist (see §6)
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              type: "Vector"
